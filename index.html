<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>A birthday surprise 🎂</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Dancing+Script:wght@600;700&family=Poppins:wght@600;800&display=swap">
<style>
:root{--rose:#c4415f;--pink:#e8708f;--ink:#3a2a2f;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{font-family:'Poppins',system-ui,sans-serif;font-weight:600;color:var(--ink);background:#fdf1e6;overflow-x:hidden}
button{font:inherit;cursor:pointer}
.scene{display:none;min-height:100vh;padding:28px 18px 110px;flex-direction:column;align-items:center;justify-content:center;text-align:center;max-width:480px;margin:0 auto}
.scene.tall{justify-content:flex-start}
.scene.full{max-width:none;margin:0;width:100%}
.scene.on{display:flex;animation:fade .6s}
@keyframes fade{from{opacity:0}}
.hide{display:none!important}
h2{margin:0;font-weight:800;line-height:1.15;font-size:1.9rem}
.btn,.next{background:var(--pink);color:#fff;border:0;border-radius:999px;padding:10px 28px;font-size:1.1rem;box-shadow:0 4px 0 var(--rose)}
.next{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);z-index:3}
.btn.alt{background:#fff;color:var(--rose);border:2px solid var(--rose);box-shadow:none}
.btn:disabled{opacity:.45}.btn.picked{opacity:1}
/* splash + lock */
#s0{background:linear-gradient(#ffe6e8,#f6b5c1)}
#s1{background:#f8eddf;transition:background .3s}#s1.bad{background:#f0a49c}
.script{font-family:'Dancing Script',cursive;font-weight:700}
.blos{background:none;border:0;padding:0;filter:drop-shadow(0 0 18px #f4a3b8);animation:pulse 2s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.12)}}
.dots{display:flex;gap:12px;justify-content:center;margin:14px 0 24px}
.dots span{width:12px;height:12px;border-radius:50%;border:1.5px solid var(--pink)}.dots span.f{background:var(--pink)}
.keys{display:grid;grid-template-columns:repeat(3,56px);gap:14px;justify-content:center}
.keys button{width:56px;height:56px;border-radius:50%;border:0;background:#fffaf2;color:var(--rose);font-size:1.3rem;font-weight:800;box-shadow:0 2px 8px #c4415f22}
.keys button:active{background:#f9d2d9}.keys .e{visibility:hidden}
/* bloom transition */
#bl{position:fixed;inset:0;z-index:20;pointer-events:none;display:none;overflow:hidden;background:#fbd9de00}
#bl.on{display:block;animation:bg 1s forwards}#bl.out{animation:fo .7s forwards}
@keyframes bg{to{background:#fbd9deee}}@keyframes fo{from{opacity:1}to{opacity:0}}
#bl i{position:absolute;border-radius:50%;transform:translate(-50%,-50%) scale(0);animation:pop .6s cubic-bezier(.3,1.5,.5,1) forwards;
 background:radial-gradient(circle,#fff9 0 7%,var(--c) 8% 38%,color-mix(in srgb,var(--c) 65%,#000) 39% 47%,var(--c) 48% 72%,color-mix(in srgb,var(--c) 70%,#000) 73% 78%,transparent 79%)}
@keyframes pop{to{transform:translate(-50%,-50%) scale(1)}}
/* film card */
.film{padding:0;max-width:none;margin:0;width:100%;justify-content:flex-start;background:linear-gradient(#e9b985,#c68b55)}
.poster{width:min(100vw,460px);height:100vh;margin:0 auto;background:#fff;padding:14px 12px 84px;display:flex;box-shadow:0 10px 40px #0005}
.col{width:37%;overflow:hidden;background:#141010}
.trk{animation:up 20s linear infinite}
@keyframes up{to{transform:translateY(-33.333%)}}
.fr{height:160px;padding:9px 18px 0;position:relative}
.fr::before,.fr::after{content:'';position:absolute;top:0;bottom:0;width:7px;background:repeating-linear-gradient(#f2e8d0 0 10px,transparent 10px 20px)}
.fr::before{left:5px}.fr::after{right:5px}
.fr img{display:block;width:100%;height:116px;object-fit:cover;border-radius:2px}
.fr b{display:block;margin-top:4px;font:700 14px 'Dancing Script',cursive;color:#f0e6d2}
.mid{flex:1;background:#f2e6cc;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:'Bebas Neue',Impact,sans-serif;font-weight:400;line-height:.95;font-size:min(7.6vw,36px)}
.mid span:nth-child(3){color:#b3232f}.mid i{font-style:normal;color:var(--pink);font-size:.6em;margin:10px 0}
/* letter + song */
.card{width:100%;background:#fff;border-radius:18px;padding:22px 18px;box-shadow:0 8px 24px #c4415f22;text-align:left;margin-bottom:18px}
.card h2{color:var(--rose);text-align:center;margin-bottom:12px}
.txt{white-space:pre-wrap;line-height:1.8;font-size:1rem}
.card.song{border:2px dashed var(--rose)}.card.song h2{font-size:1.5rem}
/* game */
.arena{position:relative;width:100%;height:56vh;margin-top:14px;border-radius:18px;background:#fff7f2;border:2px dashed var(--pink);overflow:hidden;touch-action:manipulation}
.b{position:absolute;bottom:-60px;font-size:2.8rem;animation:fl 5s linear forwards;user-select:none}
@keyframes fl{to{transform:translateY(-70vh)}}
.floral{position:relative;overflow:hidden;background:radial-gradient(circle at 30% 15%,#fffaf6,#fbe3e6 75%)}
a.btn{display:inline-block;text-decoration:none}
.in{position:relative;z-index:2;width:100%;max-width:440px;margin:0 auto}
.fh{font-family:'Dancing Script',cursive;font-weight:700;color:#8b1a36;font-size:2.7rem;line-height:1.05;text-align:center;margin:22px 0 16px}
.fc{background:#ffffffbd;border-radius:18px;padding:20px 16px;text-align:left;box-shadow:0 6px 20px #8b1a3622}
.cf{position:absolute;z-index:1;opacity:.9;animation:spin 45s linear infinite;pointer-events:none}
@keyframes spin{to{transform:rotate(360deg)}}
.vf{position:absolute;z-index:1;border-radius:50%;pointer-events:none;background:radial-gradient(circle,#fff9 0 7%,var(--c) 8% 38%,color-mix(in srgb,var(--c) 65%,#000) 39% 47%,var(--c) 48% 72%,color-mix(in srgb,var(--c) 70%,#000) 73% 78%,transparent 79%)}
/* questions */
.qa{width:100%;margin-bottom:30px}.row{display:flex;gap:12px;justify-content:center;margin-top:16px;flex-wrap:wrap}
.granted{margin-top:18px;font-size:1.2rem;line-height:1.5;background:#fff;padding:16px;border-radius:14px;box-shadow:0 6px 18px #0002}.granted.emo{font-size:3rem}
.fin{background:#fff;border-radius:16px;padding:24px 18px;box-shadow:0 8px 22px #0002;font-size:1.4rem;line-height:1.5;font-weight:800}
canvas{position:fixed;inset:0;pointer-events:none;z-index:9}
.next{left:50%;right:auto;transform:translateX(-50%);width:auto;height:auto;padding:5px 18px;border-radius:999px;background:#ffffffd9;color:var(--rose);border:1.5px solid var(--rose);box-shadow:0 2px 6px #c4415f33;font-size:0;line-height:1;animation:none}
.next::after{content:'next';font-size:.9rem;font-weight:700}
@keyframes nudge{50%{right:12px}}
.scene.on{position:relative;animation:slide .45s ease}
@keyframes slide{from{opacity:0;left:45px}}
</style>
</head>
<body>
<canvas id="fx"></canvas><div id="bl"></div>
<svg width="0" height="0" style="position:absolute"><symbol id="fl" viewBox="-50 -50 100 100"><g fill="#f4a3b8" stroke="#e8708f" stroke-width="2"><ellipse cy="-24" rx="11" ry="25"/><ellipse cy="-24" rx="11" ry="25" transform="rotate(60)"/><ellipse cy="-24" rx="11" ry="25" transform="rotate(120)"/><ellipse cy="-24" rx="11" ry="25" transform="rotate(180)"/><ellipse cy="-24" rx="11" ry="25" transform="rotate(240)"/><ellipse cy="-24" rx="11" ry="25" transform="rotate(300)"/></g><circle r="7" fill="#fff3b0"/></symbol></svg>

<!-- 0 splash -->
<section class="scene full on" id="s0">
  <button class="blos" id="tap" aria-label="Touch the blossom"><svg width="110" height="110"><use href="#fl" width="110" height="110"/></svg></button>
  <p class="script" style="font-size:1.9rem;color:#b9707f;margin-top:18px">Touch the blossom</p>
</section>

<!-- 1 lock -->
<section class="scene full" id="s1">
  <svg width="64" height="64" style="filter:drop-shadow(0 0 12px #f4a3b8)"><use href="#fl" width="64" height="64"/></svg>
  <h2 class="script" id="lt" style="font-size:2.6rem;color:var(--rose);margin-top:8px"></h2>
  <div style="font-size:.85rem;opacity:.6;margin-top:2px" id="lsub"></div>
  <div class="dots" id="dots"></div><div class="keys" id="keys"></div>
</section>

<!-- 2 film card -->
<section class="scene film">
  <div class="poster">
    <div class="col"><div class="trk" id="tl"></div></div>
    <div class="mid"><i>♥</i><span>HAPPY</span><span>BIRTHDAY</span><i>♥</i></div>
    <div class="col"><div class="trk" id="tr"></div></div>
  </div>
  <button class="next" data-next>→</button>
</section>

<!-- 3 letter -->
<section class="scene tall floral full"><div class="in"><h2 class="fh" id="lh"></h2><div class="fc"><div class="txt" id="lb"></div></div><div id="end1"></div></div>
  <button class="next hide" id="nl" data-next>→</button></section>

<!-- 4 song -->
<section class="scene tall floral full"><div class="in"><h2 class="fh">Our song 🎵</h2><div class="fc"><div class="txt" id="songtxt"></div></div>
  <div style="text-align:center;margin:18px 0 8px"><a class="btn hide" id="songlink" target="_blank" rel="noopener"></a></div><div id="end2"></div></div>
  <button class="next hide" id="nl2" data-next>→</button></section>

<!-- 5 q1 -->
<section class="scene">
  <div class="qa" id="q1"><h2></h2>
    <div class="row"><button class="btn" data-a="yes">Yes 🥹</button><button class="btn alt" data-a="no">No</button></div>
    <div class="granted hide"></div></div>
  <button class="next hide" id="n1" data-next>→</button>
</section>

<!-- 6 q2 -->
<section class="scene">
  <div class="qa" id="q2"><h2></h2>
    <div class="row"><button class="btn" data-a="yes">Yes 🥹</button><button class="btn alt" data-a="no">No</button></div>
    <div class="granted hide"></div></div>
  <button class="next hide" id="n2" data-next>→</button>
</section>

<!-- 7 final -->
<section class="scene">
  <div class="fin" id="final"></div>
</section>

<script>
/* ============ EDIT THIS PART ============ */
const CONFIG = {
  name: "SRK",
  from: " IPADIKU : Unaku Enna Name Thonutho Antha name vechiko",
  passcode: "1212",
  lockSub: "enter the passcode 🔐",
  photos: ["onece upon a time.jpeg", "favourite.jpeg", "cute (1).jpeg", "style.jpeg"],
  captions: ["Once upon a time ♥", "Favourite ♥", "Cutest ♥", "Style ♥"],
  letter: "Wish you happy birthday! 🤍 \nThank you so much for coming into my life and giving me such beautiful memories. I'll never forget the three years I spent with you.\n HII...Siva.. Naan Itha Solli Ehh Aganu.. you are my everything🤍 and You were the most beautiful gift God gave me, but I got to have that gift only for a little while, Yaru Kannu Pattucho Theriyala🥹❤️‍🩹\nAllah is always blessing you, and I always pray for you. I hope you achieve all your goals soon. So Don’t worry about anything. Allah will make everything right at the right time.I want to see you win in your life, and I’m waiting for that day.🫂🖤\n\nEpdi iruka? Odamba nalla pathuko. Puthusu puthusa fever la varuthu, nee pathu iru. Night uh Pani peithu night la veliya avlo ah povatha. night avlo ah game romba neram velaiyadatha. Nalla sapdu, ethuvum overthinking panna tha apram unaku than thala valikkum, okay va? Eppovum happy ah iru.Naan unai apdi than pathukanum nu nenachen, so nee eppovum happy ah irukanum nu than aasapaduven. Unaiya romba miss panren, atha vaarthaigalaala solla mudiyatha alavukku.🤍\n\nUn kitta pesurathukku neraya irukku. Naan thaniya irukkum pothu, enakkulla irukkura un kitta neraya pesirukan. Athu ellathaiyum un kitta pesanum nu aasaiya irukku. Un kitta polamba kooda neraya irukku pahhh. 🥹🤍\n\nஎன் அன்பை மட்டும்சாதாரணமாக எடுத்துக்கொண்டு \nயாரிடம் வேண்டுமானாலும் \nநீ பேசிக்கொள்ளலாம் \nயாரோடு வேண்டுமானாலும்\nநீ சிரித்து மகிழ்ந்து கொண்டாடலாம்\nயாரோடும் உன் நேரங்களையும்\nஉன் நாட்களையும் நீ பகிர்ந்து கொள்ளலாம்\nஆனால் உன்னை\nமுழுமையாக காதலிக்க\nஎன்னால் மட்டுமே முடியும்!\n\nApram un kitta naan onnu kekkava? naan unta neraya adam pidichi vangi tha nu ketturukan but nee vangi tharan nu sonna apo vendanu soliruva ana ipo oru vishayam kekkuran atha enaku sollu,\n Un kitta return varathukku ethavathu vazhi irukka pahhh?… 🥺🤍\n Athu evlo kashtama irunthalum naan varan ithu ethuvum summa solla la unmaiyave than solran unakkandi naan evlo kasta naalum paduva ana last la enaku nee venu avlo than paahh… 🥺🤍",
  song: "Hey erumaiku kooda blue cross irundhalum, unakaga yosika uyri naan irukeney, maratha suthi duet paada naanum unakaga than kaathiruken, maano roshom inga paakala daa!! plastic poo kooda thandha seri dhana da!! un sogatha thaniya somakaadha da!! vella manusula paiyan nee dhana da🥰💕\n\n",
  songLink: "https://www.instagram.com/reel/Dd_fOSxSWw_/?dmpr=MTJqb2FkbTE1cXo4Mg==",                       // paste your song link here (YouTube / Spotify / etc.)
  songBtn: "🎧 Click the Link",
  q1: "Do you miss me? 🫣",
  q1Yes: "I miss you too so so so so much😭🫂. Call me if you feel like it.🤍🥹🫂",
  q1No: "But I miss you very very much 😭🫂",
  q2: "Are you in love with someone else, pah?🥺🤍",
  q2Yes: "What did I ever do wrong to you, pah?🥺🤍",
  q2No: "What did I ever do wrong to you, pah?🥺🤍",
  final: "Once again happy birthday my good soul 👼🏻🫂🥹,Always god blessed you my child👼👑"

};
/* ======================================== */

const $ = s => document.querySelector(s);
const scenes = [...document.querySelectorAll('.scene')];
const photo = i => CONFIG.photos[i];
const cur = () => scenes.findIndex(s => s.classList.contains('on'));
function go(n){
  scenes.forEach((s, i) => s.classList.toggle('on', i === n));
  window.scrollTo(0, 0);
  if (n === 2 || n === 7) confetti();
}
document.querySelectorAll('[data-next]').forEach(b => b.onclick = () => go(cur() + 1));

/* swipe left (touch and push) to go to the next page */
let sx = 0, sy = 0;
addEventListener('touchstart', e => { sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, {passive: true});
addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
  if (dx < -70 && Math.abs(dx) > Math.abs(dy) * 1.5){
    const b = scenes[cur()].querySelector('.next');
    if (b && !b.classList.contains('hide')) b.click();
  }
});

/* letter + song: arrow shows only when the end of the page is on screen */
[['#end1','#nl'],['#end2','#nl2']].forEach(([e, b]) => new IntersectionObserver(en => { if (en[0].isIntersecting) $(b).classList.remove('hide'); }).observe($(e)));

/* bloom transition */
const COL = ['#e8708f','#f2a65a','#9ec3e8','#a6d8b5','#c3a6f0','#f3d36b','#ece6dc','#d9534f'];
function bloom(cb){
  const L = $('#bl'); L.className = ''; L.innerHTML = ''; void L.offsetWidth; L.className = 'on';
  for (let i = 0; i < 70; i++){
    const f = document.createElement('i'), s = 90 + Math.random() * 90;
    f.style.cssText = `left:${Math.random()*100}%;top:${Math.random()*100}%;width:${s}px;height:${s}px;--c:${COL[i % 8]};animation-delay:${Math.random()*.7}s`;
    L.appendChild(f);
  }
  setTimeout(cb, 1100);
  setTimeout(() => L.classList.add('out'), 1300);
  setTimeout(() => { L.className = ''; L.innerHTML = ''; }, 2000);
}
$('#tap').onclick = () => bloom(() => go(1));

/* lock */
$('#lt').textContent = 'For you, ' + CONFIG.name;
$('#lsub').textContent = CONFIG.lockSub;
let typed = '';
const dots = $('#dots'), keys = $('#keys');
function drawDots(){
  dots.innerHTML = '';
  for (let i = 0; i < CONFIG.passcode.length; i++) dots.insertAdjacentHTML('beforeend', '<span class="' + (i < typed.length ? 'f' : '') + '"></span>');
}
['1','2','3','4','5','6','7','8','9','','0','⌫'].forEach(k => {
  const b = document.createElement('button'); b.textContent = k;
  if (!k) b.className = 'e'; else b.setAttribute('aria-label', k);
  b.onclick = () => {
    if (k === '⌫') typed = typed.slice(0, -1);
    else if (k && typed.length < CONFIG.passcode.length) typed += k;
    drawDots();
    if (typed.length === CONFIG.passcode.length && k !== '⌫'){
      if (typed === CONFIG.passcode) setTimeout(() => bloom(() => go(2)), 200);
      else { const s = $('#s1'); s.classList.add('bad'); setTimeout(() => s.classList.remove('bad'), 500); typed = ''; setTimeout(drawDots, 300); }
    }
  };
  keys.appendChild(b);
});
drawDots();

/* film strips (scroll bottom to top) */
function strip(order, id, delay){
  const one = order.map(i => '<div class="fr"><img alt="" src="' + photo(i) + '"><b>' + CONFIG.captions[i] + '</b></div>').join('');
  $('#' + id).innerHTML = one + one + one;
  $('#' + id).style.animationDelay = delay;
}
strip([0, 1, 2, 3], 'tl', '0s');
strip([2, 3, 0, 1], 'tr', '-9s');

/* floral decoration (pages 3 and 4) */
const F = (st, w) => '<svg class="cf" style="' + st + ';width:' + w + 'px;height:' + w + 'px"><use href="#fl" width="100%" height="100%"/></svg>';
const V = (st, w, c) => '<i class="vf" style="' + st + ';width:' + w + 'px;height:' + w + 'px;--c:' + c + '"></i>';
const DECO = F('top:-70px;left:-70px', 200) + F('bottom:-80px;right:-80px', 220) + F('top:30px;right:-20px', 70) + F('bottom:60px;left:-10px', 80)
  + V('top:120px;right:-45px', 110, '#9ec3e8') + V('bottom:140px;left:-45px', 110, '#f2a65a') + V('bottom:-30px;left:35%', 90, '#a6d8b5') + V('top:-35px;left:55%', 80, '#c3a6f0');
document.querySelectorAll('.floral').forEach(e => e.insertAdjacentHTML('afterbegin', DECO));

/* letter + song */
$('#lh').textContent = 'Happy Birthday, ' + CONFIG.name + '! 🎂';
$('#lb').textContent = CONFIG.letter + '\n\n— ' + CONFIG.from + ' 💌';
$('#songtxt').textContent = CONFIG.song;
if (CONFIG.songLink){ const a = $('#songlink'); a.href = CONFIG.songLink; a.textContent = CONFIG.songBtn; a.classList.remove('hide'); }

/* questions */
function setupQ(id, text, yesTxt, noTxt, after){
  const box = $('#' + id), ans = box.querySelector('.granted'), btns = box.querySelectorAll('[data-a]');
  box.querySelector('h2').textContent = text;
  btns.forEach(b => b.onclick = () => {
    btns.forEach(x => x.disabled = true); b.classList.add('picked');
    const t = b.dataset.a === 'yes' ? yesTxt : noTxt;
    ans.textContent = t; ans.classList.toggle('emo', t.length <= 8); ans.classList.remove('hide');
    confetti(); after();
  });
}
setupQ('q1', CONFIG.q1, CONFIG.q1Yes, CONFIG.q1No, () => setTimeout(() => $('#n1').classList.remove('hide'), 800));
setupQ('q2', CONFIG.q2, CONFIG.q2Yes, CONFIG.q2No, () => setTimeout(() => $('#n2').classList.remove('hide'), 800));

/* final */
$('#final').textContent = CONFIG.final;

/* confetti */
function confetti(){
  const c = $('#fx'), x = c.getContext('2d'); c.width = innerWidth; c.height = innerHeight;
  const cl = ['#e8708f','#9ec3e8','#ffd36b','#a6e3b5','#c3a6f0'], ps = [];
  for (let i = 0; i < 120; i++) ps.push({x: Math.random() * c.width, y: -Math.random() * c.height * .5, w: 6 + Math.random() * 6, h: 10 + Math.random() * 7, vy: 2 + Math.random() * 3, vx: -1 + Math.random() * 2, r: 0, vr: -.2 + Math.random() * .4, c: cl[i % 5]});
  let f = 0;
  (function tick(){
    x.clearRect(0, 0, c.width, c.height);
    ps.forEach(p => { p.x += p.vx; p.y += p.vy; p.r += p.vr; x.save(); x.translate(p.x, p.y); x.rotate(p.r); x.fillStyle = p.c; x.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); x.restore(); });
    if (++f < 240) requestAnimationFrame(tick); else x.clearRect(0, 0, c.width, c.height);
  })();
}
</script>
</body>
</html>
