<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>A birthday surprise 🎂</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Special+Elite&display=swap">
<style>
:root{--ink:#3a2a2f;--pink:#e8708f;--rose:#c4415f;--blue:#9ec3e8;--paper:#f6ecd9;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{font-family:'Caveat','Segoe Script',cursive;color:var(--ink);background-color:#fff;
 background-image:linear-gradient(90deg,#9ec3e873 50%,transparent 50%),linear-gradient(#9ec3e873 50%,transparent 50%);background-size:44px 44px;overflow-x:hidden}
.scene{display:none;min-height:100vh;padding:28px 18px 110px;flex-direction:column;align-items:center;justify-content:center;text-align:center;max-width:480px;margin:0 auto}
.scene.tall{justify-content:flex-start;padding-top:36px}
.scene.on{display:flex;animation:fade .6s}
@keyframes fade{from{opacity:0}to{opacity:1}}
h2{margin:0;font-weight:700;line-height:1.05;font-size:2.6rem}
button{font:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--rose);outline-offset:3px}
.next,.btn{background:var(--pink);color:#fff;border:0;border-radius:999px;padding:8px 28px;font-size:1.6rem;box-shadow:0 4px 0 var(--rose)}
.next{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);z-index:3}
.hide{display:none!important}
/* passcode */
.pad{background:var(--paper);padding:18px;border-radius:14px;box-shadow:0 8px 24px #0002;width:min(86vw,300px);margin-top:22px;border:2px solid #d9c7a3}
.dots{display:flex;gap:10px;justify-content:center;margin-bottom:14px;min-height:40px}
.dots span{width:38px;height:38px;border:2px solid var(--ink);border-radius:50%;font-size:2rem;line-height:44px}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.keys button{height:52px;border-radius:50%;border:2px solid var(--ink);background:#fffaf0;font-size:1.8rem}
.keys button:active{background:var(--blue)}
.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.hint{margin-top:12px;font-size:1.3rem;opacity:.75}
/* letter */
.letter{position:relative;background:var(--paper);padding:26px 20px 22px;width:100%;box-shadow:0 8px 22px #0002;transform:rotate(-1deg);text-align:left;
 background-image:repeating-linear-gradient(transparent 0 29px,#c9b99133 29px 30px)}
.letter h2{font-size:2.3rem;color:var(--rose);margin-bottom:12px;text-align:center}
.letter .body{font:.98rem/1.9 'Special Elite','Courier New',monospace;white-space:pre-wrap}
.photos{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:6px 6px 18px}
.pol{background:#fff;padding:6px 6px 20px;box-shadow:0 5px 14px #0003;position:relative}
.pol img{display:block;width:100%;aspect-ratio:4/5;object-fit:cover}
.pol::before{content:'';position:absolute;top:-9px;left:50%;width:46px;height:16px;margin-left:-23px;background:#f5c6d3aa;transform:rotate(-4deg)}
.pol:nth-child(1){transform:rotate(-4deg)}.pol:nth-child(2){transform:rotate(3deg)}.pol:nth-child(3){transform:rotate(2deg)}.pol:nth-child(4){transform:rotate(-3deg)}
.deco{position:absolute;font-size:1.7rem}
/* song (below the letter) */
.scrollhint{text-align:center;font-size:2rem;color:var(--rose);margin:4px 0 12px;animation:bob 1.4s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(6px)}}
.song{width:100%;margin-top:14px;background:#fffaf0;border:2px dashed var(--rose);border-radius:16px;padding:22px 18px;box-shadow:0 8px 22px #0002;text-align:left;transform:rotate(.6deg)}
.song h3{margin:0 0 10px;text-align:center;font-size:2rem;color:var(--rose)}
.song .lyrics{font-size:1.55rem;line-height:1.35;white-space:pre-wrap}
/* wish */
.opts{display:grid;gap:12px;width:100%;margin-top:22px}
.opt{background:#fff;border:2px solid var(--rose);border-radius:16px;padding:14px;font-size:1.7rem;color:var(--rose);box-shadow:0 4px 0 #c4415f55}
.opt:active{transform:translateY(2px)}
.opt.picked{background:var(--rose);color:#fff}
.opt:disabled:not(.picked){opacity:.45}
.granted{margin-top:18px;font-size:1.8rem;line-height:1.25;background:#fffaf0;padding:16px;border-radius:14px;box-shadow:0 6px 18px #0002}
/* reply */
.card{background:#fffaf0;border-radius:16px;padding:26px 20px;box-shadow:0 8px 22px #0002;font-size:1.8rem;line-height:1.3;white-space:pre-wrap}
.ask{margin-top:26px;font-size:2rem}
.row{display:flex;gap:12px;justify-content:center;margin-top:12px;flex-wrap:wrap}
.btn.alt{background:#fff;color:var(--rose);border:2px solid var(--rose);box-shadow:none}
.qa{width:100%;margin-bottom:30px}.qa h2{font-size:2.2rem;margin-bottom:6px}.btn:disabled{opacity:.45;cursor:default}.btn.picked{opacity:1}.granted.emo{font-size:3.4rem}
canvas{position:fixed;inset:0;pointer-events:none;z-index:9}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<canvas id="fx"></canvas>

<!-- 1. password -->
<section class="scene on">
  <h2 style="font-size:3rem;transform:rotate(-4deg)">enter passcode<br>for a surprise! 🔐</h2>
  <div class="pad" id="pad"><div class="dots" id="dots"></div><div class="keys" id="keys"></div></div>
  <div class="hint" id="hint"></div>
</section>

<!-- 2. birthday letter with photos + song -->
<section class="scene tall">
  <div class="letter">
    <span class="deco" style="top:-14px;left:-6px">🎈</span><span class="deco" style="top:-14px;right:-6px">🎀</span>
    <h2 id="lt"></h2>
    <div class="photos" id="photos"></div>
    <div class="scrollhint" id="scrollhint"></div>
    <div class="body" id="lb"></div>
  </div>
  <button class="next" data-next>next 💌</button>
</section>

<!-- 2b. song page -->
<section class="scene">
  <div class="song">
    <h3>🎵 song 🎵</h3>
    <div class="lyrics" id="songtxt"></div>
  </div>
  <button class="next" data-next>next 💖</button>
</section>

<!-- 3. question 1 -->
<section class="scene">
  <div class="qa" id="q1">
    <h2></h2>
    <div class="row"><button class="btn" data-a="yes">Yes 🥹</button><button class="btn alt" data-a="no">No</button></div>
    <div class="granted hide"></div>
  </div>
  <button class="next hide" id="n1" data-next>next 💖</button>
</section>

<!-- 4. question 2 -->
<section class="scene">
  <div class="qa" id="q2">
    <h2></h2>
    <div class="row"><button class="btn" data-a="yes">Yes 🥹</button><button class="btn alt" data-a="no">No</button></div>
    <div class="granted hide"></div>
  </div>
  <button class="next hide" id="n2" data-next>next 💖</button>
</section>

<!-- 5. final -->
<section class="scene">
  <div class="card" id="final"></div>
  <div class="ask">Return to home page? 🏠</div>
  <div class="row">
    <button class="btn" id="yes">Yes 🏠</button>
    <button class="btn alt" id="no">No 😊</button>
  </div>
  <div id="bye" class="hide" style="font-size:1.8rem;margin-top:16px">Okay! Have a lovely day 🥰🎂</div>
</section>

<script>
/* ============ EDIT THIS PART ============ */
const CONFIG = {
  name: "birthday girl or boy ",                // birthday person
  from: "Yenna naalum vechiko😁",                // you
  passcode: "2005",
  hint: "",                   // optional hint text under the keypad
  photos: [],
  scroll: "scroll👇",
  letter: "Happy birthday, Rooh Hayati 🤩🤌🎂🎉\n\nThank you so, so much for coming into my life. \nGOOD BLESS YOU CHILD🥹✨.",
  song: "and ithuvum unaku than Eva unnai paarthalumm Uyirr verkkirennn!,\nAvalai nee paarkkadhaa varammm ketkirenn saagamal naan saagirenn!😭🤯",
  // question 1 and question 2 (shown one after another)
  q1: "Are you really surprised? 😍",
  q1Yes: "🤗🥹🫂",
  q1No: "It's okay!🙂 Maybe I'll get an even better gift on your next birthday🙂. Thank you for answering my question.🤍✨",
  q2: "Do you miss me? 🫣",
  q2Yes: "I miss you too so so so so much😭🫂. Call me if you feel like it.🤍🥹🫂",
  q2No: "But I miss you very very much 😭🫂",
  // last page
  final: "Once again happy birthday my good soul 👼🏻🫂🥹,Always god blessed you my child👼👑"
};
/* ======================================== */

const $ = s => document.querySelector(s);
const scenes = [...document.querySelectorAll('.scene')];
const ph = i => 'data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="300" height="375"><rect width="300" height="375" fill="' + ['#f9c9d8','#cfe3f7','#fff0c2','#d7efd9'][i % 4] + '"/><text x="150" y="205" font-size="64" text-anchor="middle">📷</text></svg>');
const photo = i => CONFIG.photos[i] || ph(i);

function go(n){
  if (n < 0 || n >= scenes.length) return;
  scenes.forEach((s, i) => s.classList.toggle('on', i === n));
  window.scrollTo(0, 0);
  if (n === 1 || n === scenes.length - 1) confetti();
}
const cur = () => scenes.findIndex(s => s.classList.contains('on'));
document.querySelectorAll('[data-next]').forEach(b => b.onclick = () => go(cur() + 1));

/* 1. passcode */
let typed = '';
const dots = $('#dots'), keys = $('#keys');
$('#hint').textContent = CONFIG.hint || '';
function drawDots(){
  dots.innerHTML = '';
  for (let i = 0; i < CONFIG.passcode.length; i++){
    const d = document.createElement('span');
    d.textContent = i < typed.length ? '*' : '';
    dots.appendChild(d);
  }
}
['1','2','3','4','5','6','7','8','9','⌫','0','OK'].forEach(k => {
  const b = document.createElement('button'); b.textContent = k; b.setAttribute('aria-label', k);
  b.onclick = () => {
    if (k === '⌫') typed = typed.slice(0, -1);
    else if (k !== 'OK' && typed.length < CONFIG.passcode.length) typed += k;
    drawDots();
    if (typed.length === CONFIG.passcode.length && k !== '⌫'){
      if (typed === CONFIG.passcode) setTimeout(() => go(1), 250);
      else { const p = $('#pad'); p.classList.remove('shake'); void p.offsetWidth; p.classList.add('shake'); typed = ''; setTimeout(drawDots, 300); }
    }
  };
  keys.appendChild(b);
});
drawDots();

/* 2. letter + song */
$('#lt').textContent = 'Happy Birthday, ' + CONFIG.name + '! 🎂';
[0, 1, 2, 3].forEach(i => $('#photos').insertAdjacentHTML('beforeend', '<div class="pol"><img alt="Photo ' + (i + 1) + '" src="' + photo(i) + '"></div>'));
$('#lb').textContent = CONFIG.letter + '\n\n— ' + CONFIG.from + ' 💌';
$('#scrollhint').textContent = CONFIG.scroll || '';
$('#songtxt').textContent = CONFIG.song || '';

/* 3. questions */
function setupQ(id, text, yesTxt, noTxt, after){
  const box = $('#' + id), ans = box.querySelector('.granted'), btns = box.querySelectorAll('[data-a]');
  box.querySelector('h2').textContent = text;
  btns.forEach(b => b.onclick = () => {
    btns.forEach(x => x.disabled = true); b.classList.add('picked');
    const t = b.dataset.a === 'yes' ? yesTxt : noTxt;
    ans.textContent = t; ans.classList.toggle('emo', t.length <= 8); ans.classList.remove('hide');
    confetti(); after();
  });
}
setupQ('q1', CONFIG.q1, CONFIG.q1Yes, CONFIG.q1No, () => setTimeout(() => $('#n1').classList.remove('hide'), 800));
setupQ('q2', CONFIG.q2, CONFIG.q2Yes, CONFIG.q2No, () => setTimeout(() => $('#n2').classList.remove('hide'), 800));

/* 4. final page */
$('#final').textContent = CONFIG.final;
$('#final').style.fontSize = '2.2rem';
$('#yes').onclick = () => location.reload();
$('#no').onclick = () => { $('#bye').classList.remove('hide'); confetti(); };

/* confetti */
function confetti(){
  const c = $('#fx'), x = c.getContext('2d'); c.width = innerWidth; c.height = innerHeight;
  if (matchMedia('(prefers-reduced-motion:reduce)').matches) return;
  const cl = ['#e8708f','#9ec3e8','#ffd36b','#a6e3b5','#c3a6f0'], ps = [];
  for (let i = 0; i < 120; i++) ps.push({x: Math.random() * c.width, y: -Math.random() * c.height * .5, w: 6 + Math.random() * 6, h: 10 + Math.random() * 7, vy: 2 + Math.random() * 3, vx: -1 + Math.random() * 2, r: 0, vr: -.2 + Math.random() * .4, c: cl[i % 5]});
  let f = 0;
  (function tick(){
    x.clearRect(0, 0, c.width, c.height);
    ps.forEach(p => { p.x += p.vx; p.y += p.vy; p.r += p.vr; x.save(); x.translate(p.x, p.y); x.rotate(p.r); x.fillStyle = p.c; x.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); x.restore(); });
    if (++f < 240) requestAnimationFrame(tick); else x.clearRect(0, 0, c.width, c.height);
  })();
}
</script>
</body>
</html>
